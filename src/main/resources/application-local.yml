spring:
  datasource:
    url: jdbc:h2:mem:pickleballdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  thymeleaf:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: "*"

jwt:
  secret: JdSHiEInKEVSQRkA5WjrE4Vdwx4VMaTGYx3Hszisbp/BV7FdL+uTPQKJ5i7TK+z8gspJOkrXKHxdbW9AVvQO2g==
  expiration: 3600000
  access-expiration: 900000      # 15 minutes (in ms)
  refresh-expiration: 604800000  # 7 days (in ms)

internal:
  api:
    key: 9f3c7e2a-6b11-4d4c-a2a0-8c51d91e7b52

server:
  address: 0.0.0.0
  port: 8081

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
